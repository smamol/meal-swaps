<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Swaps">
<meta name="theme-color" content="#FBF2D5">
<link rel="apple-touch-icon" href="apple-touch-icon-n8.png">
<link rel="icon" type="image/png" href="icon-n8.png">
<title>Meal Swaps</title>
<style>
  /* Licensed Nomad8 webfonts. Drop the files into fonts/ and these take over;
     until then the stacks below fall back to the closest native faces. */
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-Medium.otf") format("opentype");font-weight:400 500;font-style:normal;font-display:swap}
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-MediumItalic.otf") format("opentype");font-weight:400 500;font-style:italic;font-display:swap}
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"GT Walsheim";src:url("fonts/GT-Walsheim-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"GT Walsheim";src:url("fonts/GT-Walsheim-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

  :root{
    /* Nomad8 tokens */
    --n8-ink:#082B35; --n8-ink-80:#3a5259; --n8-ink-60:#6b7d82; --n8-ink-20:#cdd4d6;
    --n8-cream:#FBF2D5; --n8-paper:#FFFFFF; --n8-border:#E6E4DF;
    --n8-green:#97C93D; --n8-orange:#E97A52; --n8-yellow:#F5B915;
    --n8-wash-green:#DDECC6; --n8-wash-yellow:#FCF2D3; --n8-wash-pink:#FDEEEB;
    --n8-wash-blue:#E0F3F7; --n8-wash-sage:#E9F5D9; --n8-wash-blush:#F9EAE7;
    --n8-font-serif:"Feijoa","Iowan Old Style",Charter,Palatino,Georgia,serif;
    --n8-font-ui:"GT Walsheim","Avenir Next",Avenir,-apple-system,"Helvetica Neue",Arial,sans-serif;

    --bg:var(--n8-cream); --bg2:var(--n8-paper); --card:var(--n8-paper);
    --line:var(--n8-border); --text:var(--n8-ink); --muted:var(--n8-ink-80); --muted2:var(--n8-ink-60);
    --accent:var(--n8-ink);
    /* macro colours — brand accents darkened to hold 4.5:1 on paper */
    --cal:#1E6B7D; --pro:#5C8512; --fat:#C0521F; --carb:#8A6A08;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--n8-font-serif);
    line-height:1.5; padding-bottom:48px;
  }
  .wrap{max-width:520px; margin:0 auto; padding:0 16px}
  header{padding:max(20px,env(safe-area-inset-top)) 0 6px}
  h1{font-family:var(--n8-font-serif); font-size:32px; font-weight:500; letter-spacing:0;
    margin:8px 0 4px; display:flex; align-items:center; gap:12px}
  .logo{width:34px; height:34px; flex:0 0 auto}
  .sub{color:var(--muted); font-size:15px; margin:0 0 14px}

  /* tabs — Nomad8 pill buttons */
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 16px 16px; margin:0 -16px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; border:1px solid var(--n8-ink-20); background:transparent; color:var(--n8-ink);
    font-family:var(--n8-font-ui); padding:9px 20px; border-radius:999px; font-size:14px; font-weight:400;
    white-space:nowrap; cursor:pointer; transition:background .18s ease-out, border-color .18s ease-out}
  .tab .kc{display:block; font-size:11px; font-weight:400; color:var(--muted2); margin-top:1px}
  .tab.archived{opacity:.5}
  .tab.archived.active{opacity:1}
  .tab.active{background:var(--n8-ink); border-color:var(--n8-ink); color:#fff}
  .tab.active .kc{color:rgba(255,255,255,.8)}

  /* targets — flat sage panel */
  .targets{background:var(--n8-wash-green); border:none; border-radius:0; padding:18px 18px 20px; margin:2px 0 18px}
  .targets h2{font-family:var(--n8-font-serif); font-size:22px; text-transform:none; letter-spacing:0;
    color:var(--n8-ink); margin:0 0 3px; font-weight:500}
  .targets-sub{font-family:var(--n8-font-ui); font-size:12.5px; color:var(--muted); margin:0 0 14px}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .stat{text-align:center}
  .stat b{display:block; font-family:var(--n8-font-serif); font-size:26px; font-weight:700; letter-spacing:-.01em}
  .stat span{font-family:var(--n8-font-ui); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
  .stat.cal b{color:var(--cal)} .stat.pro b{color:var(--pro)}
  .stat.fat b{color:var(--fat)} .stat.carb b{color:var(--carb)}

  /* meal card — flat paper rectangle, no shadow */
  .meal{background:var(--card); border:1px solid var(--line); border-radius:0; margin-bottom:10px; overflow:hidden}
  .meal-head{display:flex; align-items:flex-start; gap:13px; padding:15px 16px}
  .icon{flex:0 0 auto; width:44px; height:44px; border-radius:0; display:grid; place-items:center; font-size:22px}
  .meal-body{flex:1; min-width:0}
  .meal-kicker{display:flex; align-items:center; gap:8px; margin-bottom:2px}
  .meal-kicker .name{font-family:var(--n8-font-serif); font-size:20px; font-weight:500; letter-spacing:0}
  .badge{font-family:var(--n8-font-ui); font-size:11px; font-weight:400; color:var(--n8-ink);
    background:var(--n8-wash-green); padding:3px 10px; border-radius:999px}
  .badge.none{color:var(--muted2); background:transparent; padding:0}
  .macros{font-family:var(--n8-font-ui); font-size:12.5px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums}
  .m-cal{color:var(--cal)} .m-pro{color:var(--pro)} .m-fat{color:var(--fat)} .m-carb{color:var(--carb)}

  /* folded meals (breakfast is made as one bowl) */
  .items{font-size:15px; color:var(--n8-ink-80); margin-top:2px}
  .meal.swappable .meal-head{cursor:pointer}
  .meal-head .chev{margin-top:11px}
  .meal.open .meal-head .chev{transform:rotate(180deg)}
  .fold-swaps{display:none; padding:4px 16px 12px; border-top:1px solid var(--line)}
  .meal.open .fold-swaps{display:block}

  /* ingredient rows */
  .ings{border-top:1px solid var(--line)}
  .ing{border-bottom:1px solid var(--line); padding:0 16px}
  .ing:last-child{border-bottom:none}
  .ing-line{display:flex; gap:11px; align-items:center; padding:11px 0}
  .ing.swappable .ing-line{cursor:pointer}
  .ing-em{flex:0 0 auto; font-size:19px; width:24px; text-align:center}
  .ing-txt{flex:1; min-width:0}
  .ing-name{font-size:15.5px; font-weight:500}
  .ing-sub{font-family:var(--n8-font-ui); font-size:11.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
  .chev{flex:0 0 auto; color:var(--muted2); transition:transform .18s ease-out; font-size:11px}
  .ing.open .chev{transform:rotate(180deg)}

  /* swap list under an ingredient */
  .swaps{display:none; padding:0 0 12px 35px}
  .ing.open .swaps{display:block}
  .swaps-label{font-family:var(--n8-font-ui); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted2); font-weight:700; padding:2px 0 6px}
  .swap{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line)}
  .swap-em{flex:0 0 auto; font-size:17px; width:22px; text-align:center}
  .swap-txt{flex:1; min-width:0}
  .swap-name{font-size:14.5px; font-weight:500}
  .swap-d{font-family:var(--n8-font-ui); font-size:11.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}

  a{color:var(--n8-ink); text-decoration:underline; text-underline-offset:3px}
  a:hover{color:var(--pro)}

  footer{font-family:var(--n8-font-ui); color:var(--muted2); font-size:12px; text-align:center; padding:22px 8px; line-height:1.6}
  footer .n8mark{display:block; width:74px; margin:0 auto 12px; opacity:.85}
  footer .status{color:var(--fat)}
  header{display:flex; align-items:center; justify-content:space-between}
  #nav a{font-family:var(--n8-font-ui); font-size:14px}

  /* coach and admin views */
  .clients h2{font-family:var(--n8-font-serif); font-size:24px; font-weight:500; margin:10px 0 10px}
  .clients h3{font-family:var(--n8-font-ui); font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted2); margin:14px 0 6px}
  .clients .client{display:block; width:100%; text-align:left; font:inherit; font-size:18px; padding:14px 16px; margin:0 0 8px;
    background:var(--card); border:1px solid var(--line); color:var(--text); cursor:pointer}
  .clients .muted, .flagrow .muted{color:var(--muted2); font-family:var(--n8-font-ui); font-size:12.5px}
  .flagrow{background:var(--card); border:1px solid var(--line); padding:12px 16px; margin:0 0 8px; font-size:15px}
  .flagrow .note{color:var(--muted); font-style:italic; margin:4px 0}
  .flagrow .resolve{margin-left:10px; font-family:var(--n8-font-ui); font-size:12px; padding:4px 12px; border-radius:999px;
    border:1px solid var(--n8-ink-20); background:transparent; cursor:pointer}
  .viewing{font-family:var(--n8-font-ui); font-size:14px; margin:0 0 8px}
  .sheet{position:fixed; left:0; right:0; bottom:0; background:var(--n8-paper); border-top:1px solid var(--line);
    padding:16px max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-bottom)); box-shadow:0 -6px 24px rgba(8,43,53,.12)}
  .sheet textarea{display:block; width:100%; font:inherit; font-size:16px; padding:10px; border:1px solid var(--n8-ink-20); margin:4px 0 10px}
  .sheet button{font-family:var(--n8-font-ui); font-size:15px; padding:10px 20px; border:none; border-radius:999px; background:var(--n8-ink); color:#fff}

  .account{font-family:var(--n8-font-ui); font-size:12px; text-align:center; margin-top:-14px; padding-bottom:20px}
  .account a{color:var(--muted2)}
  .account .signin-again{color:var(--fat); margin-right:12px}
  .signin .retry{font-family:var(--n8-font-ui); font-size:15px; padding:10px 20px; border:none; border-radius:999px; background:var(--n8-ink); color:#fff}

  /* coach and admin views: report a swap that looks wrong */
  /* sign-in */
  .signin{padding:8px 0 24px}
  .signin h2{font-family:var(--n8-font-serif); font-size:24px; font-weight:500; margin:8px 0 6px}
  .signin p{font-size:15.5px; color:var(--muted); margin:0 0 14px}
  .signin input{display:block; width:100%; font:inherit; font-size:17px; padding:12px 14px; margin:0 0 12px;
    border:1px solid var(--n8-ink-20); border-radius:0; background:var(--n8-paper); color:var(--n8-ink)}
  .signin #code{letter-spacing:6px; font-size:22px}
  .signin button{font-family:var(--n8-font-ui); font-size:15px; padding:12px 22px; border:none; border-radius:999px;
    background:var(--n8-ink); color:#fff; cursor:pointer}
  .signin button:disabled{opacity:.5}
  .signin .signin-msg{color:var(--fat); margin-top:12px; min-height:1em}

  .flag{display:inline-block; margin-top:5px; padding:0; border:none; background:none; cursor:pointer;
    font-family:var(--n8-font-ui); font-size:11px; color:var(--muted2); text-decoration:underline; text-underline-offset:2px}
  /* brand: nomad8 (deploy.js) */
  :root{--n8-ink:#082B35; --n8-ink-80:#3a5259; --n8-ink-60:#6b7d82; --n8-ink-20:#cdd4d6; --n8-cream:#FBF2D5; --n8-paper:#FFFFFF; --n8-border:#E6E4DF; --n8-green:#97C93D; --n8-orange:#E97A52; --n8-yellow:#F5B915; --n8-wash-green:#DDECC6; --n8-wash-yellow:#FCF2D3; --n8-wash-pink:#FDEEEB; --n8-wash-blue:#E0F3F7; --n8-wash-sage:#E9F5D9; --n8-wash-blush:#F9EAE7; --cal:#1E6B7D; --pro:#5C8512; --fat:#C0521F; --carb:#8A6A08}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="icon-n8.png" alt="">Meal Swaps</h1>
    <nav id="nav" hidden><a href="#" id="to-clients">Clients</a></nav>
  </header>
</div>
<div class="wrap" id="app"></div>
<div class="wrap account" id="account" hidden><a href="#" class="signin-again" hidden>Sign in again</a> <a href="#" class="signout">Sign out</a></div>

<!-- One page for every client (step 2), signed in (step 3, 2026-10-23). The
     plan, food library and swap groups come from Supabase after sign-in and are
     kept on the phone for offline use (data.js); view.js draws them with the
     shared engine. supabase-js ships with the site, never from a CDN.
     ?v= must match APP_VERSION below. -->
<script src="vendor/supabase.js?v=2026-10-23.3"></script>
<script src="config.js?v=2026-10-23.3"></script>
<script src="engine.js?v=2026-10-23.3"></script>
<script src="view.js?v=2026-10-23.3"></script>
<script src="data.js?v=2026-10-23.3"></script>
<script src="signin.js?v=2026-10-23.3"></script>
<script src="coach.js?v=2026-10-23.3"></script>
<script>
/* ---------- version (keep in sync with version.txt on deploy) ---------- */
const APP_VERSION = '2026-10-23.3';

/* ---------- sign-in, then this person's plan ----------
   The phone's copy shows at once; the fresh one replaces it when it arrives,
   and is saved only once it has drawn. Offline, the copy stays with "Couldn't
   check for updates". If the session is lost for an unclear reason, the copy
   stays and a "Sign in again" link appears. The copy goes only on a definite
   rejection, an account with no profile, or signing out. */
const sb = supabase.createClient(CONFIG.url, CONFIG.anonKey, {auth: {persistSession: true,
  autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'mealswaps-auth'}});
const D = createData(sb);
const app = document.getElementById('app');
let onScreen = null;   /* what's drawn, so a refresh that changes nothing doesn't redraw */
let view = 0;          /* bumped on every navigation; a boot that finishes after one leaves the screen alone */

/* draws a bundle; false if it can't be drawn. A fresh bundle is saved only now */
function show(bundle, status, {fresh = false, signIn = false} = {}){
  const key = JSON.stringify(bundle) + '|' + (status || '');
  if (key !== onScreen){
    try { mountPlan(app, bundle, {status}); }
    catch (e){ onScreen = null; return false; }
    onScreen = key;
  }
  if (fresh) D.save(bundle);
  account.hidden = false;
  againLink.hidden = !signIn;
  return true;
}
function message(text, retry){
  onScreen = null;
  app.innerHTML = `<div class="signin"><p>${text}</p>${retry ? '<button type="button" class="retry">Try again</button>' : ''}</div>`;
  if (retry) app.querySelector('.retry').addEventListener('click', () => start());
  account.hidden = false;
}
/* outside #app, so redrawing a day never drops it */
const account = document.getElementById('account');
const againLink = account.querySelector('.signin-again');
account.querySelector('.signout').addEventListener('click', async e => {
  e.preventDefault();
  await sb.auth.signOut({scope: 'local'});
  D.clear();
  location.reload();
});
againLink.addEventListener('click', async e => {
  e.preventDefault();
  view++;
  onScreen = null; account.hidden = true; nav.hidden = true;
  await signIn('');
  start();
});
/* a different person signing in on this phone never sees the last one's copy */
async function signIn(msg){
  await showSignIn(app, sb, {message: msg});
  const { data } = await sb.auth.getSession();
  const c = D.cached();
  if (c && data.session && c.clientId !== data.session.user.id) D.clear();
}
/* coaches and the admin get a "Clients" link; a coach with no plan of their
   own (Livi) opens on their clients */
const nav = document.getElementById('nav');
let who = null;
function clients(hasPlan){
  view++;
  onScreen = null;
  nav.hidden = true;
  mountClients(app, D, who, {onOwnPlan: hasPlan ? () => start() : null});
}
nav.querySelector('#to-clients').addEventListener('click', e => { e.preventDefault(); clients(true); });

async function start(){
  const mine = ++view;
  const cached = D.cached();
  try {
    if (cached){ show(cached, null); if (who) nav.hidden = who.role === 'client'; }
    const r = await D.boot();
    if (mine !== view) return;   /* they moved on while this was loading */
    if (r.status === 'signed-out' || r.status === 'no-profile'){
      onScreen = null; who = null; account.hidden = true; nav.hidden = true;
      if (r.status === 'no-profile'){ await sb.auth.signOut({scope: 'local'}); forgetSent(localStorage); }
      await signIn(r.status === 'no-profile' ? "This email isn't set up yet. Ask your dietitian" : '');
      return start();
    }
    if (!r.signIn) who = await D.me().catch(() => who);
    if (mine !== view) return;
    const coachView = !!who && who.role !== 'client';
    if (r.bundle){
      const ok = show(r.bundle, r.status, {fresh: r.status === null, signIn: r.signIn});
      if (!ok && !(cached && show(cached, "Couldn't check for updates"))) message(WENT_WRONG, true);
      nav.hidden = !coachView;
    }
    else if (coachView && !cached){ account.hidden = false; clients(false); }
    else if (!cached) message(r.status, r.status === WENT_WRONG);
  } catch (e){
    if (mine === view && !cached) message(WENT_WRONG, true);
  }
}
start();

/* ---------- auto-update: fetch fresh version, reload if stale (offline-safe) ---------- */
(async function checkForUpdate(){
  try{
    const res=await fetch('version.txt?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const latest=(await res.text()).trim();
    if(latest && latest!==APP_VERSION && !sessionStorage.getItem('bv_reloaded')){
      sessionStorage.setItem('bv_reloaded','1');
      location.replace(location.pathname+'?v='+encodeURIComponent(latest));
    }
  }catch(e){ /* offline — keep working with the cached copy */ }
})();
</script>
</body>
</html>
