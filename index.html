<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Swaps">
<meta name="theme-color" content="#11161d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Meal Swaps</title>
<style>
  :root{
    --bg:#0f1318; --bg2:#151b22; --card:#1b232c; --card2:#212b35;
    --line:#2a3540; --text:#eef2f6; --muted:#9aa7b4; --muted2:#6f7d8a;
    --accent:#16a34a;
    --cal:#5aa9ff; --pro:#33d17a; --fat:#ff9f43; --carb:#c084fc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; padding-bottom:48px;
  }
  .wrap{max-width:520px; margin:0 auto; padding:0 16px}
  header{padding:max(20px,env(safe-area-inset-top)) 0 6px}
  h1{font-size:26px; font-weight:800; letter-spacing:-.02em; margin:8px 0 2px; display:flex; align-items:center; gap:10px}
  .logo{width:34px; height:34px; border-radius:9px; flex:0 0 auto}
  .sub{color:var(--muted); font-size:14px; margin:0 0 14px}

  /* tabs */
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 16px 14px; margin:0 -16px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; border:1px solid var(--line); background:var(--bg2); color:var(--muted);
    padding:9px 14px; border-radius:999px; font-size:14px; font-weight:600; white-space:nowrap; cursor:pointer;
    transition:.15s}
  .tab .kc{display:block; font-size:11px; font-weight:600; color:var(--muted2); margin-top:1px}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .tab.active .kc{color:rgba(255,255,255,.85)}

  /* targets */
  .targets{background:var(--bg2); border:1px solid var(--line); border-radius:18px; padding:16px; margin:2px 0 18px}
  .targets h2{font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    margin:0 0 12px; font-weight:700}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .stat{text-align:center}
  .stat b{display:block; font-size:21px; font-weight:800; letter-spacing:-.02em}
  .stat span{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em}
  .stat.cal b{color:var(--cal)} .stat.pro b{color:var(--pro)}
  .stat.fat b{color:var(--fat)} .stat.carb b{color:var(--carb)}

  /* meal card */
  .meal{background:var(--card); border:1px solid var(--line); border-radius:18px; margin-bottom:12px; overflow:hidden}
  .meal-head{display:flex; align-items:flex-start; gap:13px; padding:15px 16px}
  .icon{flex:0 0 auto; width:44px; height:44px; border-radius:13px; display:grid; place-items:center; font-size:22px}
  .meal-body{flex:1; min-width:0}
  .meal-kicker{display:flex; align-items:center; gap:8px; margin-bottom:3px}
  .meal-kicker .name{font-size:16px; font-weight:750; letter-spacing:-.01em}
  .badge{font-size:11px; font-weight:700; color:var(--accent); background:rgba(22,163,74,.13);
    padding:2px 8px; border-radius:999px}
  .badge.none{color:var(--muted2); background:transparent; padding:0; font-weight:600}
  .macros{font-size:12.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
  .m-cal{color:var(--cal)} .m-pro{color:var(--pro)} .m-fat{color:var(--fat)} .m-carb{color:var(--carb)}

  /* ingredient rows */
  .ings{border-top:1px solid var(--line)}
  .ing{border-bottom:1px solid var(--line); padding:0 16px}
  .ing:last-child{border-bottom:none}
  .ing-line{display:flex; gap:11px; align-items:center; padding:10px 0}
  .ing.swappable .ing-line{cursor:pointer}
  .ing-em{flex:0 0 auto; font-size:19px; width:24px; text-align:center}
  .ing-txt{flex:1; min-width:0}
  .ing-name{font-size:14px; font-weight:600}
  .ing-sub{font-size:11.5px; color:var(--muted); margin-top:1px; font-variant-numeric:tabular-nums}
  .chev{flex:0 0 auto; color:var(--muted2); transition:transform .2s; font-size:11px}
  .ing.open .chev{transform:rotate(180deg)}

  /* swap list under an ingredient */
  .swaps{display:none; padding:0 0 11px 35px}
  .ing.open .swaps{display:block}
  .swaps-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted2);
    font-weight:700; padding:1px 0 5px}
  .swap{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-top:1px dashed var(--line)}
  .swap-em{flex:0 0 auto; font-size:17px; width:22px; text-align:center}
  .swap-txt{flex:1; min-width:0}
  .swap-name{font-size:13.5px; font-weight:600}
  .swap-d{font-size:11.5px; color:var(--muted); margin-top:1px; font-variant-numeric:tabular-nums}

  footer{color:var(--muted2); font-size:12px; text-align:center; padding:22px 8px; line-height:1.6}
</style>
</head>

<div class="wrap">

/* ---------- swap pools ----------
   b = the macro a swap must hold: 1 protein, 2 fat, 3 carbs (index into v).
   An ingredient's swaps are the other pool members, re-portioned to the same
   amount of that macro; the other macros are shown as honest differences. */
const POOLS = {
  protein: {b:1, keys:['chicken_raw','fish_raw','beef_raw','pork_raw','prawns_cooked','egg','lentils_cooked']},
  starch:  {b:3, keys:['rice_cooked','pasta_cooked','couscous','kumara_cooked','potato_cooked']},
  bread:   {b:3, keys:['bagel','crumpet','english_muffin','vogels','fruit_bread','rice_cake','corn_thin','wrap']},
  fats:    {b:2, keys:['peanut_butter','almond_butter','almonds','pumpkin_seeds','sunflower_seeds','mixed_seeds','avocado']},
  sweet:   {b:3, keys:['honey','jam']},
  fruit:   {b:3, keys:['banana','apple','kiwifruit','orange','pear','mandarin','blueberries','strawberries','raspberries']},
  cereal:  {b:3, keys:['rice_bubbles','granola','muesli','weetbix']},
  treat:   {b:2, keys:['dark_choc','almonds','almond_butter','peanut_butter']},
  fetaFree:{b:2, keys:['avocado','egg','pumpkin_seeds','sunflower_seeds','mixed_seeds','hummus']},
  intra:   {b:3, keys:['sis_gel','fruit_pouch','sports_drink']},
};

/* ---------- swap maths (shared with evals.js — keep pure) ---------- */
const scaleV = (v,g) => v.map(x => x*g/100);
function ingAmountG(ing){
  if (ing.g != null) return ing.g;
  if (ing.ml != null) return ing.ml;
  return ing.u * FOODS[ing.k].u.g;
}
function ingMacros(ing){ return scaleV(FOODS[ing.k].v, ingAmountG(ing)); }
function mealMacros(meal){
  const t = [0,0,0,0];
  for (const ing of meal.ing){ const m = ingMacros(ing); for (let i=0;i<4;i++) t[i]+=m[i]; }
  return t;
}
function fmtU(u){
  const w = Math.floor(u), f = u - w;
  return (w ? w : '') + (f >= 0.25 ? '½' : '') || String(w);
}
function unitLabel(F, u){ return `${fmtU(u)} ${u > 1 ? (F.u.p || F.u.n + 's') : F.u.n}`; }
function ingLabel(ing){
  if (ing.t) return ing.t;
  const F = FOODS[ing.k];
  if (ing.u != null) return unitLabel(F, ing.u);
  if (ing.ml != null) return `${ing.ml}ml ${F.l}`;
  return `${ing.g}g ${F.l}`;
}
/* A swap qualifies when its re-portioned amount lands within 25% of the base
   ingredient's pool macro after rounding to a weighable portion, and stays a
   portion someone would actually serve. */
function computeSwaps(ing){
  const pool = POOLS[ing.pool];
  if (!pool) return [];
  const base = ingMacros(ing), target = base[pool.b];
  if (!target) return [];
  const out = [];
  for (const k of pool.keys){
    if (k === ing.k) continue;
    const F = FOODS[k], per = F.v[pool.b];
    if (!per) continue;
    const need = target / per * 100;
    let g, label;
    if (F.u){
      const step = F.u.step || 0.5;
      let u = Math.round(need / F.u.g / step) * step;
      if (F.u.min && u < F.u.min) u = F.u.min;
      if (u < step) u = step;
      if (u > (F.u.max || 8)) continue;
      g = u * F.u.g; label = unitLabel(F, u);
    } else if (F.ml){
      const ml = Math.round(need / 50) * 50;
      if (ml < 50 || ml > (F.max || 600)) continue;
      g = ml; label = `${ml}ml ${F.l}`;
    } else {
      g = need < 20 ? Math.round(need) : Math.round(need / 5) * 5;
      if (g < 5 || g > (F.max || 400)) continue;
      label = `${g}g ${F.l}`;
    }
    const m = scaleV(F.v, g);
    if (Math.abs(m[pool.b] - target) / target > 0.25) continue;
    out.push({k, e:F.e, label, m, d:m.map((x,i)=>x-base[i])});
  }
  return out;
}

  Se_a:{type:'snack', title:'Afternoon Snack', ing:[
    {k:'bagel', u:1, t:"1 bagel (Rebel/Abe's)", pool:'bread'}, {k:'peanut_butter', g:10, pool:'fats'},
    {k:'jam', g:10, pool:'sweet'}, {k:'banana', u:1, pool:'fruit'}]},

  des1:{type:'dessert', title:'Evening Snack', ing:[
    {k:'yoghurt', g:160}, {k:'blueberries', g:60, pool:'fruit'},
    {k:'kiwifruit', u:1, pool:'fruit'}, {k:'dark_choc', g:30, pool:'treat'}]},
  des2:{type:'dessert', title:'Evening Snack', ing:[
    {k:'yoghurt', g:160}, {k:'rice_bubbles', g:20, pool:'cereal'},
    {k:'blueberries', g:60, pool:'fruit'}, {k:'kiwifruit', u:1, pool:'fruit'},
    {k:'dark_choc', g:15, pool:'treat'}]},
};

/* ---------- days (the 7 variants) ---------- */
const DAYS = [
  {name:"Light training session",     hint:"single session",        meals:[M.preBanana,M.b436,M.Sa_m,M.L1,M.Sb_a,M.D1,M.des1]},
  {name:"Mod training session",       hint:"single + intra",        meals:[M.preCrumpet,M.intra,M.b436,M.Sd_m,M.L2,M.Se_a,M.D3,M.des2]},
  {name:"Mod training session PLUS",  hint:"single + intra, bigger", meals:[M.preCrumpet,M.intra,M.b436,M.Sc_m,M.L1,M.Se_a,M.D3,M.des2]},
  {name:"Double training day",        hint:"two sessions",          meals:[M.preBanana,M.b490,M.Sd_m,M.L3,M.prePlus,M.intra,M.D2,M.des2]},
  {name:"Double training day PLUS",   hint:"two sessions, bigger",   meals:[M.preCrumpet,M.b490,M.Sc_m,M.L1,M.prePlus,M.intra,M.D2,M.des2]},
  {name:"Big day",                    hint:"2.5h — easy run + aerobic conditioning", meals:[M.preCrumpet,M.intraBig,M.b490,M.postRefuel,M.Sc_m,M.L1,M.Se_a,M.D2,M.des2]},
];

/* ---------- presentation ---------- */
const STYLE = {
  pre:      {em:"☕", bg:"#3a2a14", fg:"#ff9f43"},
  breakfast:{em:"🥣", bg:"#15263a", fg:"#5aa9ff"},
  intra:    {em:"💧", bg:"#0f2e2c", fg:"#2dd4bf"},
  snack:    {em:"🍎", bg:"#33183a", fg:"#c084fc"},
  lunch:    {em:"🍽️", bg:"#1d2740", fg:"#818cf8"},
  dinner:   {em:"🌙", bg:"#3a1820", fg:"#fb7185"},
  dessert:  {em:"🍫", bg:"#2a1838", fg:"#d8b4fe"},
};
const BASIS_NAME = {1:'same protein', 2:'same fat', 3:'same carbs'};
const BASIS_CLS  = {1:'m-pro', 2:'m-fat', 3:'m-carb'};
const BASIS_LTR  = {1:'P', 2:'F', 3:'C'};

const tabsEl=document.getElementById('tabs');
const statsEl=document.getElementById('stats');
const mealsEl=document.getElementById('meals');
const titleEl=document.getElementById('targets-title');
const footEl=document.getElementById('foot');

const R = x => Math.round(x);
function macroLine(m){
  return `<span class="m-cal">${R(m[0])} cal</span> · <span class="m-pro">${R(m[1])}g P</span> · <span class="m-fat">${R(m[2])}g F</span> · <span class="m-carb">${R(m[3])}g C</span>`;
}
function ingSub(m){
  return `${R(m[0])} cal · ${R(m[1])}P · ${R(m[2])}F · ${R(m[3])}C`;
}
function deltaLine(swap, basis){
  const parts = [];
  const db = R(swap.d[basis]);
  parts.push(`<span class="${BASIS_CLS[basis]}">${Math.abs(db) < 1 ? '=' : (db > 0 ? '+' : '−') + Math.abs(db) + 'g '}${BASIS_LTR[basis]}</span>`);
  for (const [i, cls, ltr] of [[1,'m-pro','P'],[2,'m-fat','F'],[3,'m-carb','C']]){
    if (i === basis) continue;
    const d = R(swap.d[i]);
    if (Math.abs(d) < 1) continue;
    parts.push(`<span class="${cls}">${d > 0 ? '+' : '−'}${Math.abs(d)}g ${ltr}</span>`);
  }
  const dc = R(swap.d[0]);
  if (Math.abs(dc) >= 5) parts.push(`<span class="m-cal">${dc > 0 ? '+' : '−'}${Math.abs(dc)} cal</span>`);
  return parts.length > 1 || Math.abs(db) >= 1 ? parts.join(' · ') : parts[0] + ' · near-exact match';
}

function render(day){
  const t = day.meals.reduce((a,meal)=>{
    const m = mealMacros(meal);
    return [a[0]+m[0], a[1]+m[1], a[2]+m[2], a[3]+m[3]];
  }, [0,0,0,0]);
  titleEl.textContent = `${day.name} — Day Total`;
  statsEl.innerHTML = `
    <div class="stat cal"><b>${R(t[0])}</b><span>cal</span></div>
    <div class="stat pro"><b>${R(t[1])}g</b><span>protein</span></div>
    <div class="stat fat"><b>${R(t[2])}g</b><span>fat</span></div>
    <div class="stat carb"><b>${R(t[3])}g</b><span>carbs</span></div>`;

  mealsEl.innerHTML = day.meals.map((meal, mi)=>{
    const s = STYLE[meal.type];
    const mm = mealMacros(meal);
    const rows = meal.ing.map((ing, ii)=>{
      const F = FOODS[ing.k];
      const swaps = ing.pool ? computeSwaps(ing) : [];
      const swappable = swaps.length > 0;
      const swapHtml = swappable ? `<div class="swaps">
          <div class="swaps-label">Swap for — ${BASIS_NAME[POOLS[ing.pool].b]}</div>${
          swaps.map(sw=>`<div class="swap"><div class="swap-em">${sw.e}</div><div class="swap-txt">
            <div class="swap-name">${sw.label}</div>
            <div class="swap-d">${deltaLine(sw, POOLS[ing.pool].b)}</div></div></div>`).join('')
        }</div>` : '';
      return `<div class="ing ${swappable?'swappable':''}" data-m="${mi}" data-i="${ii}">
        <div class="ing-line">
          <div class="ing-em">${F.e}</div>
          <div class="ing-txt">
            <div class="ing-name">${ingLabel(ing)}</div>
            <div class="ing-sub">${ingSub(ingMacros(ing))}</div>
          </div>
          ${swappable?'<div class="chev">▼</div>':''}
        </div>${swapHtml}</div>`;
    }).join('');
    const nSwap = meal.ing.filter(i=>i.pool && computeSwaps(i).length).length;
    const badge = nSwap ? `<span class="badge">${nSwap} swappable</span>`
                        : `<span class="badge none">as planned</span>`;
    return `<div class="meal">
      <div class="meal-head">
        <div class="icon" style="background:${s.bg};color:${s.fg}">${s.em}</div>
        <div class="meal-body">
          <div class="meal-kicker"><span class="name">${meal.title}</span>${badge}</div>
          <div class="macros">${macroLine(mm)}</div>
        </div>
      </div>
      <div class="ings">${rows}</div></div>`;
  }).join('');

  mealsEl.querySelectorAll('.ing.swappable .ing-line').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });

  footEl.innerHTML = `All data from the NZ Food Composition Database<br>
    <span style="opacity:.6">v${APP_VERSION}</span>`;
}

let active=0;
function buildTabs(){
  tabsEl.innerHTML=DAYS.map((d,i)=>
    `<div class="tab ${i===active?'active':''}" data-i="${i}">${d.name}<span class="kc">${d.hint}</span></div>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      active=+t.dataset.i;
      localStorage.setItem('mealday',active);
      buildTabs(); render(DAYS[active]);
      window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}

active=Math.min(+(localStorage.getItem('mealday')||0),DAYS.length-1);
buildTabs();
render(DAYS[active]);

/* ---------- auto-update: fetch fresh version, reload if stale (offline-safe) ---------- */
(async function checkForUpdate(){
  try{
    const res=await fetch('version.txt?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const latest=(await res.text()).trim();
    if(latest && latest!==APP_VERSION && !sessionStorage.getItem('bv_reloaded')){
      sessionStorage.setItem('bv_reloaded','1');
      location.replace(location.pathname+'?v='+encodeURIComponent(latest));
    }
  }catch(e){ /* offline — keep working with the cached copy */ }
})();
</script>
