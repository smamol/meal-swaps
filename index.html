<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Swaps">
<meta name="theme-color" content="#FBF2D5">
<link rel="apple-touch-icon" href="apple-touch-icon-n8.png">
<link rel="icon" type="image/png" href="icon-n8.png">
<title>Meal Swaps</title>
<style>
  /* Licensed Nomad8 webfonts. Drop the files into fonts/ and these take over;
     until then the stacks below fall back to the closest native faces. */
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-Medium.otf") format("opentype");font-weight:400 500;font-style:normal;font-display:swap}
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-MediumItalic.otf") format("opentype");font-weight:400 500;font-style:italic;font-display:swap}
  @font-face{font-family:"Feijoa";src:url("fonts/FeijoaTest-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"GT Walsheim";src:url("fonts/GT-Walsheim-Regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"GT Walsheim";src:url("fonts/GT-Walsheim-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}

  :root{
    /* Nomad8 tokens */
    --n8-ink:#082B35; --n8-ink-80:#3a5259; --n8-ink-60:#6b7d82; --n8-ink-20:#cdd4d6;
    --n8-cream:#FBF2D5; --n8-paper:#FFFFFF; --n8-border:#E6E4DF;
    --n8-green:#97C93D; --n8-orange:#E97A52; --n8-yellow:#F5B915;
    --n8-wash-green:#DDECC6; --n8-wash-yellow:#FCF2D3; --n8-wash-pink:#FDEEEB;
    --n8-wash-blue:#E0F3F7; --n8-wash-sage:#E9F5D9; --n8-wash-blush:#F9EAE7;
    --n8-font-serif:"Feijoa","Iowan Old Style",Charter,Palatino,Georgia,serif;
    --n8-font-ui:"GT Walsheim","Avenir Next",Avenir,-apple-system,"Helvetica Neue",Arial,sans-serif;

    --bg:var(--n8-cream); --bg2:var(--n8-paper); --card:var(--n8-paper);
    --line:var(--n8-border); --text:var(--n8-ink); --muted:var(--n8-ink-80); --muted2:var(--n8-ink-60);
    --accent:var(--n8-ink);
    /* macro colours — brand accents darkened to hold 4.5:1 on paper */
    --cal:#1E6B7D; --pro:#5C8512; --fat:#C0521F; --carb:#8A6A08;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--n8-font-serif);
    line-height:1.5; padding-bottom:48px;
  }
  .wrap{max-width:520px; margin:0 auto; padding:0 16px}
  header{padding:max(20px,env(safe-area-inset-top)) 0 6px}
  h1{font-family:var(--n8-font-serif); font-size:32px; font-weight:500; letter-spacing:0;
    margin:8px 0 4px; display:flex; align-items:center; gap:12px}
  .logo{width:34px; height:34px; flex:0 0 auto}
  .sub{color:var(--muted); font-size:15px; margin:0 0 14px}

  /* tabs — Nomad8 pill buttons */
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:4px 16px 16px; margin:0 -16px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto; border:1px solid var(--n8-ink-20); background:transparent; color:var(--n8-ink);
    font-family:var(--n8-font-ui); padding:9px 20px; border-radius:999px; font-size:14px; font-weight:400;
    white-space:nowrap; cursor:pointer; transition:background .18s ease-out, border-color .18s ease-out}
  .tab .kc{display:block; font-size:11px; font-weight:400; color:var(--muted2); margin-top:1px}
  .tab.archived{opacity:.5}
  .tab.archived.active{opacity:1}
  .tab.active{background:var(--n8-ink); border-color:var(--n8-ink); color:#fff}
  .tab.active .kc{color:rgba(255,255,255,.8)}

  /* targets — flat sage panel */
  .targets{background:var(--n8-wash-green); border:none; border-radius:0; padding:18px 18px 20px; margin:2px 0 18px}
  .targets h2{font-family:var(--n8-font-serif); font-size:22px; text-transform:none; letter-spacing:0;
    color:var(--n8-ink); margin:0 0 3px; font-weight:500}
  .targets-sub{font-family:var(--n8-font-ui); font-size:12.5px; color:var(--muted); margin:0 0 14px}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .stat{text-align:center}
  .stat b{display:block; font-family:var(--n8-font-serif); font-size:26px; font-weight:700; letter-spacing:-.01em}
  .stat span{font-family:var(--n8-font-ui); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
  .stat.cal b{color:var(--cal)} .stat.pro b{color:var(--pro)}
  .stat.fat b{color:var(--fat)} .stat.carb b{color:var(--carb)}

  /* meal card — flat paper rectangle, no shadow */
  .meal{background:var(--card); border:1px solid var(--line); border-radius:0; margin-bottom:10px; overflow:hidden}
  .meal-head{display:flex; align-items:flex-start; gap:13px; padding:15px 16px}
  .icon{flex:0 0 auto; width:44px; height:44px; border-radius:0; display:grid; place-items:center; font-size:22px}
  .meal-body{flex:1; min-width:0}
  .meal-kicker{display:flex; align-items:center; gap:8px; margin-bottom:2px}
  .meal-kicker .name{font-family:var(--n8-font-serif); font-size:20px; font-weight:500; letter-spacing:0}
  .badge{font-family:var(--n8-font-ui); font-size:11px; font-weight:400; color:var(--n8-ink);
    background:var(--n8-wash-green); padding:3px 10px; border-radius:999px}
  .badge.none{color:var(--muted2); background:transparent; padding:0}
  .macros{font-family:var(--n8-font-ui); font-size:12.5px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums}
  .m-cal{color:var(--cal)} .m-pro{color:var(--pro)} .m-fat{color:var(--fat)} .m-carb{color:var(--carb)}

  /* folded meals (breakfast is made as one bowl) */
  .items{font-size:15px; color:var(--n8-ink-80); margin-top:2px}
  .meal.swappable .meal-head{cursor:pointer}
  .meal-head .chev{margin-top:11px}
  .meal.open .meal-head .chev{transform:rotate(180deg)}
  .fold-swaps{display:none; padding:4px 16px 12px; border-top:1px solid var(--line)}
  .meal.open .fold-swaps{display:block}

  /* ingredient rows */
  .ings{border-top:1px solid var(--line)}
  .ing{border-bottom:1px solid var(--line); padding:0 16px}
  .ing:last-child{border-bottom:none}
  .ing-line{display:flex; gap:11px; align-items:center; padding:11px 0}
  .ing.swappable .ing-line{cursor:pointer}
  .ing-em{flex:0 0 auto; font-size:19px; width:24px; text-align:center}
  .ing-txt{flex:1; min-width:0}
  .ing-name{font-size:15.5px; font-weight:500}
  .ing-sub{font-family:var(--n8-font-ui); font-size:11.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
  .chev{flex:0 0 auto; color:var(--muted2); transition:transform .18s ease-out; font-size:11px}
  .ing.open .chev{transform:rotate(180deg)}

  /* swap list under an ingredient */
  .swaps{display:none; padding:0 0 12px 35px}
  .ing.open .swaps{display:block}
  .swaps-label{font-family:var(--n8-font-ui); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted2); font-weight:700; padding:2px 0 6px}
  .swap{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line)}
  .swap-em{flex:0 0 auto; font-size:17px; width:22px; text-align:center}
  .swap-txt{flex:1; min-width:0}
  .swap-name{font-size:14.5px; font-weight:500}
  .swap-d{font-family:var(--n8-font-ui); font-size:11.5px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}

  a{color:var(--n8-ink); text-decoration:underline; text-underline-offset:3px}
  a:hover{color:var(--pro)}

  footer{font-family:var(--n8-font-ui); color:var(--muted2); font-size:12px; text-align:center; padding:22px 8px; line-height:1.6}
  footer .n8mark{display:block; width:74px; margin:0 auto 12px; opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img class="logo" src="icon-n8.png" alt="">Meal Swaps</h1>
  </header>
</div>
<div class="wrap"><div class="tabs" id="tabs"></div></div>
<div class="wrap">
  <div class="targets">
    <h2 id="targets-title">Day Targets</h2>
    <p class="targets-sub" id="targets-sub"></p>
    <div class="stats" id="stats"></div>
  </div>
  <div id="meals"></div>
  <footer id="foot"></footer>
</div>

<script>
/* ---------- version (keep in sync with version.txt on deploy) ---------- */
const APP_VERSION = '2026-09-13.2';

/* ---------- food library ----------
   v = [kcal, protein g, fat g, available carb g] per 100 g, straight from the
   NZ Food Composition Database (AFCD fallback, product label where neither has
   the food) — pinned by nz-reference.json, verified by evals.js. Never guess.
   u = unit foods: n/p name (singular/plural), g grams per unit, step rounding,
   min/max sensible counts. ml = measured in millilitres (v per 100 ml).
   max = largest sensible swap portion in grams — bigger suggestions are dropped. */
const FOODS = {
  /* cookedP = cooked protein per 100 g, from the pinned nz-reference *_cooked
     entries. Cooked weight is derived, not guessed: protein is conserved when
     meat is cooked (water/fat leave, protein stays), so
     cooked g = raw g × raw-protein ÷ cookedP. Prawns are bought cooked. */
  chicken_raw:    {l:'chicken breast (raw)', e:'🍗', v:[98.5,22.5,0.8,0],  cookedP:28.2},  // chicken_cooked
  fish_raw:       {l:'white fish (raw)',     e:'🐟', v:[96.6,20.3,1.6,0],  cookedP:25.2},  // fish_cooked
  beef_raw:       {l:'lean beef (raw)',      e:'🥩', v:[107.6,20.4,2.8,0], cookedP:30.2},  // beef_cooked
  pork_raw:       {l:'pork loin (raw)',      e:'🐖', v:[110.2,23.2,1.8,0], cookedP:29.4},  // pork_cooked
  prawns_cooked:  {l:'prawns (cooked)',      e:'🍤', v:[104.2,23.7,0.9,0]},
  /* tinned tuna is eaten as it comes out of the tin — drained values, no cooked weight */
  tuna_water:     {l:'tinned tuna in spring water (drained)', e:'🐟', v:[117.1,26.6,1.0,0], max:200},
  egg:            {l:'boiled egg',           e:'🥚', v:[130.5,14.6,7.9,0.3], u:{n:'boiled egg',p:'boiled eggs',g:50,step:1,min:1,max:4}},
  lentils_cooked: {l:'lentils (cooked)',     e:'🫘', v:[105.4,7.63,0.5,15.5], max:400},

  /* rawC = raw/dry available-carb per 100 g. Available-carb is conserved when a
     carb cooks (only water changes), so raw/dry g = cooked g × cooked-carb ÷ rawC.
     dry:true → weighed dry as a grain (rice, pasta); else raw veg (kumara).
     kumara: NZ FoodFiles raw entry. rice/pasta: NZ retail labels. Couscous and
     potato have no pinned raw counterpart, so they show cooked only. */
  rice_cooked:    {l:'rice (cooked)',        e:'🍚', v:[132.4,2.78,0.4,28.7], rawC:79,   dry:true},
  pasta_cooked:   {l:'pasta (cooked)',       e:'🍝', v:[135.3,5.05,0.8,25.4], rawC:72.5, dry:true},
  couscous:       {l:'couscous (cooked)',    e:'🌾', v:[174.7,6.69,1.0,32.7]},
  kumara_cooked:  {l:'kumara (cooked)',      e:'🍠', v:[86.8,1.25,0.21,18.8], rawC:18.8},
  potato_cooked:  {l:'potato (cooked)',      e:'🥔', v:[54.5,1.67,0.1,10.8], rawC:12.8, max:700},

  /* pinned to Abe's "The Natural" (plain) bagel, 90g each — Sandy's brand */
  bagel:          {l:"bagel (Abe's, plain)", e:'🥯', v:[277,9.59,1.35,55.7], u:{n:"Abe's bagel",p:"Abe's bagels",g:90}},
  crumpet:        {l:'crumpet',              e:'🥞', v:[178.3,6.56,1.0,34.0], u:{n:'crumpet',g:50}},
  vogels:         {l:"slice Vogel's",        e:'🍞', v:[267.7,10.8,8.48,33.4], u:{n:"slice Vogel's",p:"slices Vogel's",g:40}},
  fruit_bread:    {l:'slice fruit toast',    e:'🍇', v:[265.8,8.8,3.7,47.3], u:{n:'slice fruit toast',p:'slices fruit toast',g:40}},
  /* pinned to Ceres Organics Brown Rice Cakes, Original — Sandy's brand */
  rice_cake:      {l:'rice cake (Ceres Organic)', e:'🍘', v:[380,8.0,2.1,82], u:{n:'Ceres rice cake',g:9}},
  corn_thin:      {l:'corn thin',            e:'🌽', v:[344.2,8.13,1.2,73.3], u:{n:'corn thin',g:6}},
  wrap:           {l:'large wrap',           e:'🌯', v:[279.6,8.75,7.31,42.1], u:{n:'large wrap',g:60}},

  /* pinned to Pic's Peanut Butter, Crunchy — Sandy's brand */
  peanut_butter:  {l:"peanut butter (Pic's Crunchy)", e:'🥜', v:[595,26.7,47.8,14.3], max:60},
  almond_butter:  {l:'almond butter',        e:'🥜', v:[595.1,20.1,53.0,5.65], max:60},
  almonds:        {l:'almonds',              e:'🌰', v:[595.1,20.1,53.0,5.65], max:50},
  pumpkin_seeds:  {l:'pumpkin seeds',        e:'🎃', v:[568.8,31.1,47.5,1.4], max:40},
  sunflower_seeds:{l:'sunflower seeds',      e:'🌻', v:[599.9,20.5,55.2,3.6], max:40},
  mixed_seeds:    {l:'mixed seeds (LSA)',    e:'🌱', v:[525.8,19.4,45.7,2.49], max:40},
  avocado:        {l:'avocado',              e:'🥑', v:[218.0,1.78,22.7,0.08], max:110},
  hummus:         {l:'hummus',               e:'🧆', v:[140.5,6.94,6.22,11.3], max:80},

  honey:          {l:'honey',                e:'🍯', v:[291.6,0.28,0.4,70.5], max:40},
  jam:            {l:'jam',                  e:'🫙', v:[279.6,0.25,0.68,66.5], max:40},

  banana:         {l:'banana',               e:'🍌', v:[94.9,1.03,0.3,20.8], u:{n:'banana',g:120}},
  apple:          {l:'apple',                e:'🍎', v:[50.9,0.21,0.3,10.7], u:{n:'apple',g:150}},
  kiwifruit:      {l:'kiwifruit',            e:'🥝', v:[55.9,0.73,0.57,10.7], u:{n:'kiwifruit',p:'kiwifruit',g:75}},
  orange:         {l:'orange',               e:'🍊', v:[41.3,1.06,0.05,8.17], u:{n:'orange',g:130}},
  pear:           {l:'pear',                 e:'🍐', v:[50.9,0.37,0.3,10.0], u:{n:'pear',g:150}},
  mandarin:       {l:'mandarin',             e:'🍊', v:[40.9,0.91,0.2,8.11], u:{n:'mandarin',g:70,max:4}},
  blueberries:    {l:'blueberries',          e:'🫐', v:[50.4,0.63,0.3,9.3], max:250},
  strawberries:   {l:'strawberries',         e:'🍓', v:[28.7,0.64,0.37,4.8], max:250},
  raspberries:    {l:'raspberries',          e:'🍓', v:[45.2,1.17,0.95,5.8], max:250},

  /* pinned to Whittaker's 92% Cocoa Ghana Intense Dark label (2530 kJ/100g), not
     generic AFCD dark chocolate — Sandy's brand, per her Sep 2026 base-plan swap */
  dark_choc:      {l:'dark chocolate (Whittaker’s 92%)', e:'🍫', v:[604.7,13.1,47.0,14.2], max:50},
  /* pinned to Sanitarium Ricies — Sandy's brand (NZ's actual product name) */
  rice_bubbles:   {l:'Ricies (Sanitarium)',  e:'🥣', v:[380,6.3,0.5,85.4], max:60},
  granola:        {l:'granola',              e:'🥣', v:[425.4,8.81,14.4,60.0], max:60},
  muesli:         {l:'muesli',               e:'🥣', v:[393.4,10.8,10.8,59.2], max:60},
  weetbix:        {l:'Weet-Bix',             e:'🌾', v:[329.8,12.5,2.3,58.4], u:{n:'Weet-Bix',p:'Weet-Bix',g:15,max:4}},

  cheese:         {l:'cheese',               e:'🧀', v:[413.5,24.6,35.6,0.0], max:100},
  /* generic chutney, no NZ/AFCD row — pinned to Barker's Sundried Tomato & Olive
     Chutney label (581 kJ/100g) per FSANZ-RULE.md's label fallback */
  chutney:        {l:'chutney',              e:'🥫', v:[138.9,2.1,2.1,28.8], max:60},
  /* whole-snack alternatives to the PB + jam on both snacks — Livi's Rest day
     footnote ("cheese & tomato / cottage cheese + honey"), added 2026-09-13 at
     Sandy's request for every day. Cottage cheese is the standard full-fat row
     (NZ F11), not the 1% light one — "normal full-fat cottage cheese" */
  tomato:         {l:'tomato',               e:'🍅', v:[14.8,0.38,0.16,2.27], max:200},
  cottage_cheese: {l:'cottage cheese (full-fat)', e:'🧀', v:[94.6,13.7,3.5,2.0], max:150},

  /* whole-snack alternative — per 100g DRY mix (serving = 42g; milk listed separately) */
  swolecake:      {l:'SwoleCakes pancake mix', e:'🥞', v:[365.7,28.4,5.1,49.8], max:120},
  /* whole-serving alternative — pinned to the 425ml Rokeby Dutch Chocolate Protein
     Smoothie bottle label; v is per-100ml so the fixed 1-bottle unit gives the
     label's 287 cal/30g P/6.4g F/27.2g C */
  rokeby_smoothie:{l:'Rokeby protein smoothie (Dutch Chocolate)', e:'🥤', v:[67.5,7.06,1.51,6.4],
    u:{n:'Rokeby protein smoothie',g:425,step:1,min:1,max:1}},
  /* whole-serving alternative — pinned to the 250ml Sanitarium Up&Go Protein
     Energize Vanilla bottle label (85 cal/7.1g P/1.8g F/9.6g C per 100ml, so
     212.5 cal/17.75g P/4.5g F/24g C per bottle); considerably less protein-dense
     than Rokeby (30g P/425ml vs 17.75g P/250ml) */
  upandgo_vanilla:{l:'Up&Go Protein Energize (Vanilla)', e:'🥛', v:[85,7.1,1.8,9.6],
    u:{n:'Up&Go Protein Energize (250ml bottle)',g:250,step:1,min:1,max:2}},

  /* whole-snack alternative — Sandy's home-baked blueberry protein slice, derived
     over the finished 872 g tray she weighed: 100g raw egg (NZ G1016) + 30g Go Good
     whey isolate + 4g vanilla extract (AFCD F009350) + 125ml almond milk (NZ C1127)
     + 180g rolled oats (NZ E1075) + 40g chia seed (NZ Q1026) + 200g blueberries
     (NZ L1050) + 100g 72% dark chocolate (NZ W1026), no added sweetener.
     Tray totals 1768 cal / 82g P / 78g F / 158g C; v is that ÷ 8.72 */
  blueberry_slice:{l:'blueberry protein slice', e:'🫐', v:[202.7,9.35,8.93,18.11], max:250},

  /* intra fuels — v per unit via nominal 100 g unit (label values, per item) */
  sis_gel:        {l:'SiS isotonic gel',     e:'💧', v:[87,0,0,22], u:{n:'SiS isotonic gel',p:'SiS isotonic gels',g:100,step:0.5,max:3}},
  /* pinned to Wattie's for Baby Apple, Peach & Mango 120g pouch label — Sandy's brand */
  fruit_pouch:    {l:"fruit pouch (Wattie's Apple, Peach & Mango)", e:'🧃', v:[70.5,0.4,0.1,15.7], u:{n:'fruit pouch',p:'fruit pouches',g:100,step:0.5,max:4}},
  sports_drink:   {l:'sports drink',         e:'🥤', v:[31.2,0,0,7.6], ml:true, max:600},

  /* base-only foods (never offered as swaps) */
  feta:           {l:'feta',                 e:'🧀', v:[279.6,16.9,23.4,1.1]},
  yoghurt:        {l:'Greek yoghurt',        e:'🥛', v:[74,9.5,2.8,2.7]},
  salad:          {l:'salad',                e:'🥗', v:[21.3,1.94,0.31,1.8]},
  canned_tomato:  {l:'canned tomatoes',      e:'🍅', v:[18.6,1.13,0.1,2.54]},
  /* veg alternatives to canned tomatoes, all boiled/steamed except bok choy
     (NZ database has no cooked bok choy entry, raw used instead) — Sandy's
     request 2026-09. greens/spinach keys and values match the same NZ-pinned
     entries Anna's app already uses */
  greens:         {l:'broccoli',              e:'🥦', v:[30.4,3.03,0.5,1.75], max:400},
  spinach:        {l:'spinach',               e:'🥬', v:[19.4,2.81,0.4,0.0], max:400},
  courgette:      {l:'courgette',             e:'🥒', v:[16.0,2.1,0.2,0.7], max:400},
  bok_choy:       {l:'bok choy',              e:'🥬', v:[20.1,1.9,0.2,1.7], max:400},
  brussels_sprout:{l:'brussels sprouts',      e:'🥦', v:[45.4,3.2,0.5,5.2], max:400},
  oats:           {l:'oats',                 e:'🥣', v:[360.9,12.2,7.24,56.7]},
  flaxseed:       {l:'flaxseed',             e:'🌱', v:[451.7,18.4,37.0,0.7]},
  /* pinned to Go Good Whey Protein Isolate, Unflavoured — Sandy's brand */
  /* pinned to Go Good Whey Protein Isolate, Unflavoured — Sandy's brand.
     Keyed whey_isolate (not whey) since Brenda's/Anna's apps pin a
     different, generic whey product to the shared "whey" reference key */
  whey_isolate:   {l:'whey (Go Good Isolate, unflavoured)', e:'💪', v:[375,89,1,1]},
  almond_milk:    {l:'almond milk',          e:'🥛', v:[17.0,0.54,1.4,0.2]},
};

/* ---------- swap pools ----------
   b = the macro a swap must hold: 1 protein, 2 fat, 3 carbs (index into v).
   An ingredient's swaps are the other pool members, re-portioned to the same
   amount of that macro; the other macros are shown as honest differences. */
const POOLS = {
  protein: {b:1, keys:['chicken_raw','fish_raw','beef_raw','pork_raw','prawns_cooked','tuna_water','egg','lentils_cooked']},
  starch:  {b:3, keys:['rice_cooked','pasta_cooked','couscous','kumara_cooked','potato_cooked']},
  /* English muffin dropped 2026-09-12 — Sandy doesn't like them ("remove them
     from my list"), so it leaves every bread swap, not just the slice ones */
  bread:   {b:3, keys:['bagel','crumpet','vogels','fruit_bread','rice_cake','corn_thin','wrap']},
  /* sunflower seeds, pumpkin seeds and LSA (mixed_seeds — Linseed/Sunflower/
     Almond) dropped 2026-09: Sandy's peanut butter is a rice-cake/cracker
     spread, and loose seeds don't work there ("just doesn't taste good") */
  fats:    {b:2, keys:['peanut_butter','almond_butter','almonds','avocado']},
  sweet:   {b:3, keys:['honey','jam']},
  fruit:   {b:3, keys:['banana','apple','kiwifruit','orange','pear','mandarin','blueberries','strawberries','raspberries']},
  cereal:  {b:3, keys:['rice_bubbles','granola','muesli','weetbix']},
  treat:   {b:2, keys:['dark_choc','almonds','almond_butter','peanut_butter']},
  fetaFree:{b:2, keys:['avocado','egg','pumpkin_seeds','sunflower_seeds','mixed_seeds','hummus']},
  intra:   {b:3, keys:['sis_gel','fruit_pouch','sports_drink']},
  /* basis 0 (calories): these veg are too low and mismatched on P/F/C to
     macro-match sensibly — courgette/spinach/broccoli read protein-dominant
     boiled, brussels sprouts/tomatoes carb-dominant, so calorie parity is
     the only basis that makes portions come out sane across all of them */
  veg:     {b:0, keys:['canned_tomato','greens','spinach','courgette','bok_choy','brussels_sprout']},
};

/* ---------- swap maths (shared with evals.js — keep pure) ---------- */
const scaleV = (v,g) => v.map(x => x*g/100);
function ingAmountG(ing){
  if (ing.g != null) return ing.g;
  if (ing.ml != null) return ing.ml;
  return ing.u * FOODS[ing.k].u.g;
}
function ingMacros(ing){ return scaleV(FOODS[ing.k].v, ingAmountG(ing)); }
function mealMacros(meal){
  const t = [0,0,0,0];
  for (const ing of meal.ing){ const m = ingMacros(ing); for (let i=0;i<4;i++) t[i]+=m[i]; }
  return t;
}
function fmtU(u){
  const w = Math.floor(u), f = u - w;
  return (w ? w : '') + (f >= 0.25 ? '½' : '') || String(w);
}
function unitLabel(F, u){ return `${fmtU(u)} ${u > 1 ? (F.u.p || F.u.n + 's') : F.u.n}`; }
/* second weight, derived not guessed:
     raw meats — protein is conserved, so cooked g = raw g × raw-protein ÷ cookedP
     cooked carbs — available-carb is conserved, so raw/dry g = cooked g × cooked-carb ÷ rawC
   Rounded to 5 g for larger weights, 1 g for the small portions. */
function roundW(g){ return g >= 50 ? Math.round(g / 5) * 5 : Math.round(g); }
function weightTag(k, g){
  const F = FOODS[k];
  if (F.cookedP != null) return ` · ${roundW(g * F.v[1] / F.cookedP)}g cooked`;
  if (F.rawC != null) return ` · ${roundW(g * F.v[3] / F.rawC)}g ${F.dry ? 'dry' : 'raw'}`;
  return '';
}
function ingLabel(ing){
  if (ing.t) return ing.t + (ing.g != null ? weightTag(ing.k, ing.g) : '');
  const F = FOODS[ing.k];
  if (ing.u != null) return unitLabel(F, ing.u);
  if (ing.ml != null) return `${ing.ml}ml ${F.l}`;
  return `${ing.g}g ${F.l}${weightTag(ing.k, ing.g)}`;
}
/* A swap qualifies when its re-portioned amount lands within 10% of the base
   ingredient's pool macro after rounding to a weighable portion (Sandy's
   rule: nothing gets more headroom than 10%, so coarse unit roundings like
   half a bagel for a crumpet simply don't appear). It must also stay a
   portion someone would actually serve. */
function computeSwaps(ing){
  const pool = POOLS[ing.pool];
  if (!pool) return [];
  const base = ingMacros(ing), target = base[pool.b];
  if (!target) return [];
  const out = [];
  for (const k of pool.keys){
    if (k === ing.k && !ing.generic) continue;   /* generic slots list their own base food back, rendered "as planned" */
    const F = FOODS[k], per = F.v[pool.b];
    if (!per) continue;
    const need = target / per * 100;
    let g, label;
    if (F.u){
      const step = F.u.step || 0.5;
      let u = Math.round(need / F.u.g / step) * step;
      if (F.u.min && u < F.u.min) u = F.u.min;
      if (u < step) u = step;
      if (u > (F.u.max || 8)) continue;
      g = u * F.u.g; label = unitLabel(F, u);
    } else if (F.ml){
      const ml = Math.round(need / 50) * 50;
      if (ml < 50 || ml > (F.max || 600)) continue;
      g = ml; label = `${ml}ml ${F.l}`;
    } else {
      g = need < 20 ? Math.round(need) : Math.round(need / 5) * 5;
      if (g < 5 || g > (F.max || 400)) continue;
      label = `${g}g ${F.l}${weightTag(k, g)}`;
    }
    const m = scaleV(F.v, g);
    if (Math.abs(m[pool.b] - target) / target > 0.10) continue;
    out.push({k, e:F.e, label, m, d:m.map((x,i)=>x-base[i]), self:k===ing.k});
  }
  return out;
}
/* Whole-meal alternatives (meal.mealSwaps): curated combos that replace the
   entire snack — e.g. protein pancakes + a banana — calorie-matched to the
   meal within the same 10% rule, other macros shown as honest differences. */
function mealSwapAlts(meal){
  if (!meal.mealSwaps) return [];
  const base = mealMacros(meal);
  return meal.mealSwaps.map(ms => {
    const m = [0,0,0,0];
    for (const p of ms.parts){ const v = ingMacros(p); for (let i=0;i<4;i++) m[i]+=v[i]; }
    return {e: ms.e, label: ms.parts.map(ingLabel).join(' + '), m, d: m.map((x,i)=>x-base[i]), parts: ms.parts};
  });
}

const R = x => Math.round(x);
function macroLine(m){
  return `<span class="m-cal">${R(m[0])} cal</span> · <span class="m-pro">${R(m[1])}g P</span> · <span class="m-fat">${R(m[2])}g F</span> · <span class="m-carb">${R(m[3])}g C</span>`;
}
function ingSub(m){
  return `${R(m[0])} cal · ${R(m[1])}P · ${R(m[2])}F · ${R(m[3])}C`;
}
function deltaLine(swap, basis){
  if (swap.self) return 'as planned';   /* generic slot listing its own base */
  const DEF = [[0,'m-cal','cal',''],[1,'m-pro','P','g '],[2,'m-fat','F','g '],[3,'m-carb','C','g ']];
  const parts = [];
  const [bi, bcls, bltr, bunit] = DEF[basis];
  const db = R(swap.d[basis]);
  parts.push(`<span class="${bcls}">${Math.abs(db) < 1 ? '=' : (db > 0 ? '+' : '−') + Math.abs(db) + bunit}${bltr}</span>`);
  for (const [i, cls, ltr, unit] of DEF){
    if (i === basis) continue;
    const d = R(swap.d[i]);
    const min = i === 0 ? 5 : 1;
    if (Math.abs(d) < min) continue;
    parts.push(`<span class="${cls}">${d > 0 ? '+' : '−'}${Math.abs(d)}${unit}${ltr}</span>`);
  }
  return parts.length > 1 || Math.abs(db) >= 1 ? parts.join(' · ') : parts[0] + ' · near-exact match';
}
function swapRows(swaps, basis){
  return swaps.map(sw=>`<div class="swap"><div class="swap-em">${sw.e}</div><div class="swap-txt">
    <div class="swap-name">${sw.label}</div>
    <div class="swap-d">${deltaLine(sw, basis)}</div></div></div>`).join('');
}

function render(day){
  const t = day.meals.reduce((a,meal)=>{
    const m = mealMacros(meal);
    return [a[0]+m[0], a[1]+m[1], a[2]+m[2], a[3]+m[3]];
  }, [0,0,0,0]);
  titleEl.textContent = `${day.name} — Day Total`;
  subEl.textContent = day.archived ? `${day.hint} · ${day.was}` : `${day.hint} · ${day.was}`;

    <div class="stat cal"><b>${R(t[0])}</b><span>cal</span></div>
    <div class="stat pro"><b>${R(t[1])}g</b><span>protein</span></div>
    <div class="stat fat"><b>${R(t[2])}g</b><span>fat</span></div>
    <div class="stat carb"><b>${R(t[3])}g</b><span>carbs</span></div>`;

  mealsEl.innerHTML = day.meals.map((meal, mi)=>{
    const s = STYLE[meal.type];
    const mm = mealMacros(meal);
    if (meal.folded){
      const fSwaps = meal.ing.filter(i=>i.pool).map(ing=>({ing, swaps:computeSwaps(ing)})).filter(x=>x.swaps.length);
      const mAlts = mealSwapAlts(meal);
      const hasSwaps = fSwaps.length > 0 || mAlts.length > 0;
      const badge = hasSwaps ? `<span class="badge">${fSwaps.length + (mAlts.length ? 1 : 0)} swappable</span>`
                              : `<span class="badge none">as planned</span>`;
      const ingSwapHtml = fSwaps.map(({ing, swaps})=>
          `<div class="swaps-label">Swap for — ${BASIS_NAME[POOLS[ing.pool].b]} — instead of ${ingLabel(ing)}</div>${
          swaps.map(sw=>`<div class="swap"><div class="swap-em">${sw.e}</div><div class="swap-txt">
            <div class="swap-name">${sw.label}</div>
            <div class="swap-d">${deltaLine(sw, POOLS[ing.pool].b)}</div></div></div>`).join('')}`).join('');
      const mealSwapHtml = mAlts.length ? `<div class="swaps-label">Swap the whole meal — ${BASIS_NAME[0]}</div>${swapRows(mAlts, 0)}` : '';
      const swapHtml = hasSwaps ? `<div class="fold-swaps">${ingSwapHtml}${mealSwapHtml}</div>` : '';
      return `<div class="meal ${hasSwaps?'swappable':''}">
        <div class="meal-head">
          <div class="icon" style="background:${s.bg};color:${s.fg}">${s.em}</div>
          <div class="meal-body">
            <div class="meal-kicker"><span class="name">${meal.title}</span>${badge}</div>
            <div class="items">${meal.ing.map(ingLabel).join(' + ')}</div>
            <div class="macros">${macroLine(mm)}</div>
          </div>
          ${hasSwaps?'<div class="chev">▼</div>':''}
        </div>${swapHtml}</div>`;
    }
    const rows = meal.ing.map((ing, ii)=>{
      const F = FOODS[ing.k];
      const swaps = ing.pool ? computeSwaps(ing) : [];
      const swappable = swaps.length > 0;
      const swapHtml = swappable ? `<div class="swaps">
          <div class="swaps-label">Swap for — ${BASIS_NAME[POOLS[ing.pool].b]}</div>${
          swaps.map(sw=>`<div class="swap"><div class="swap-em">${sw.e}</div><div class="swap-txt">
            <div class="swap-name">${sw.label}</div>
            <div class="swap-d">${deltaLine(sw, POOLS[ing.pool].b)}</div></div></div>`).join('')
        }</div>` : '';
      return `<div class="ing ${swappable?'swappable':''}" data-m="${mi}" data-i="${ii}">
        <div class="ing-line">
          <div class="ing-em">${F.e}</div>
          <div class="ing-txt">
            <div class="ing-name">${ingLabel(ing)}</div>
            <div class="ing-sub">${ingSub(ingMacros(ing))}</div>
          </div>
          ${swappable?'<div class="chev">▼</div>':''}
        </div>${swapHtml}</div>`;
    }).join('');
    const nSwap = meal.ing.filter(i=>i.pool && computeSwaps(i).length).length;
    const badge = nSwap ? `<span class="badge">${nSwap} swappable</span>`
                        : `<span class="badge none">as planned</span>`;
    const mAlts = mealSwapAlts(meal);
    const msHtml = mAlts.length ? `<div class="fold-swaps">
        <div class="swaps-label">Swap the whole snack — ${BASIS_NAME[0]}</div>${swapRows(mAlts, 0)}</div>` : '';
    return `<div class="meal ${mAlts.length?'swappable':''}">
      <div class="meal-head">
        <div class="icon" style="background:${s.bg};color:${s.fg}">${s.em}</div>
        <div class="meal-body">
          <div class="meal-kicker"><span class="name">${meal.title}</span>${badge}</div>
          <div class="macros">${macroLine(mm)}</div>
        </div>
        ${mAlts.length?'<div class="chev">▼</div>':''}
      </div>
      <div class="ings">${rows}</div>${msHtml}</div>`;
  }).join('');

  mealsEl.querySelectorAll('.ing.swappable .ing-line').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });
  mealsEl.querySelectorAll('.meal.swappable .meal-head').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });

  footEl.innerHTML = `<img class="n8mark" src="nomad-logo.png" alt="Nomad8">
    All data from the NZ Food Composition Database unless it's a specific brand<br>
    <span style="opacity:.6">v${APP_VERSION}</span>`;
}

/* ---------- auto-update: fetch fresh version, reload if stale (offline-safe) ---------- */
(async function checkForUpdate(){
  try{
    const res=await fetch('version.txt?_='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const latest=(await res.text()).trim();
    if(latest && latest!==APP_VERSION && !sessionStorage.getItem('bv_reloaded')){
      sessionStorage.setItem('bv_reloaded','1');
      location.replace(location.pathname+'?v='+encodeURIComponent(latest));
    }
  }catch(e){ /* offline — keep working with the cached copy */ }
})();
</script>
